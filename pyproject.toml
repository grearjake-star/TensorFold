[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorfold"
dynamic = ["version"]
description = "Fast, exact LLM decoding on NVIDIA GPUs (DGX Spark / GB10 first) behind an OpenAI-compatible endpoint"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "TensorFold contributors" }]
keywords = ["llm", "cuda", "dgx-spark", "gb10", "exl3", "inference", "speculative-decoding", "openai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Environment :: GPU :: NVIDIA CUDA",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# CUDA uses the container's torch and triton (NVIDIA's PyTorch container); nothing here replaces them.
dependencies = [
  "numpy>=1.26",
  "huggingface-hub>=0.24",
  "tokenizers>=0.20",
  "safetensors>=0.4",
  "jinja2>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
vision = ["Pillow>=10", "transformers>=5.3,<6", "av>=12"]
# response_format, guided_* and structured_outputs on every server: grammar-shaped replies (xgrammar brings torch)
grammar = ["xgrammar>=0.2.8,<0.3"]

[project.scripts]
tensorfold = "tensorfold.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "LICENSES/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tensorfold.cuda" = ["*.cu", "*.cuh", "*.cpp"]
"tensorfold.cuda.kernels" = ["*.cu", "*.cuh", "*.cpp"]
"tensorfold.families.qwen3_5.cuda" = ["*.cu", "*.cpp"]
"tensorfold.families.qwen4_exp.cuda" = ["*.cu", "*.cpp", "*.txt"]
"tensorfold.families.nemotron_h" = ["*.txt"]
"tensorfold.families.glm5_next.cuda" = ["*.cu", "*.cpp"]
"tensorfold.families.nemotron_h.cuda" = ["*.cu", "*.cpp"]
"tensorfold.cuda.exl3" = ["*.cu", "*.cuh", "*.cpp"]
"tensorfold.cuda.nvfp4" = ["*.cu", "*.cuh", "*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120

[tool.setuptools.dynamic]
version = { attr = "tensorfold.__version__" }
